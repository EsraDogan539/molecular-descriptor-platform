name: Screenshots (temporary)
on:
  push:
    branches: [ci/screens-v11]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          (streamlit run app_v08.py --server.headless true --server.port 8501 --client.toolbarMode viewer > /dev/null 2>&1 &)
          sleep 25
          python scripts/capture_screenshots.py --url http://localhost:8501 --out docs/screenshots > shots.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots; git commit -m "Screenshots [skip ci]" || true; git push
