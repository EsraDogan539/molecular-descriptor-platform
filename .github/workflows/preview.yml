name: Preview (temporary)
on:
  push:
    branches: [feat/use-cases]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          mkdir -p docs/preview
          python -m pytest -q tests > docs/preview/tests.txt 2>&1 || true
          (streamlit run app_v08.py --server.headless true --server.port 8501 --client.toolbarMode viewer > /dev/null 2>&1 &)
          sleep 25
          python scripts/capture_usecases.py > docs/preview/capture.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs/preview; git commit -m "Preview [skip ci]" || true; git push
