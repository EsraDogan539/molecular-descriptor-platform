name: Donor/acceptor grouped CV (temporary)

on:
  push:
    branches:
      - ci/donor-acceptor-cv

permissions:
  contents: write

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt scikit-learn xgboost
      - name: Run grouped cross-validation
        run: python benchmarks/grouped_cv_donor_acceptor.py --out benchmarks/results
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results
          git commit -m "Add donor/acceptor grouped CV results [skip ci]" || echo "no changes"
          git push
