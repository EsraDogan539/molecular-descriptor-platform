name: Fetch source SI coordinates (temporary)
on:
  push:
    branches: [ci/fetch-si]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ci5c00345_si_002.zip (CC BY 4.0)
        run: |
          mkdir -p si_source
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for url in \
            "https://pmc.ncbi.nlm.nih.gov/articles/instance/12152970/bin/ci5c00345_si_002.zip" \
            "https://pmc.ncbi.nlm.nih.gov/articles/PMC12152970/bin/ci5c00345_si_002.zip" \
            "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12152970/bin/ci5c00345_si_002.zip" \
            "https://pubs.acs.org/doi/suppl/10.1021/acs.jcim.5c00345/suppl_file/ci5c00345_si_002.zip"; do
            echo "trying $url"
            if curl -fsSL -A "$UA" -o si_source/ci5c00345_si_002.zip "$url" && unzip -tq si_source/ci5c00345_si_002.zip; then
              echo "$url" > si_source/SOURCE_URL.txt; break
            fi
          done
          ls -la si_source
          unzip -l si_source/ci5c00345_si_002.zip > si_source/listing.txt || true
          head -40 si_source/listing.txt; tail -5 si_source/listing.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add si_source
          git commit -m "Add fetched SI archive for inspection [skip ci]" || echo "nothing"
          git push
