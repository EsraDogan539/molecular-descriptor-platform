name: Keep web app awake

# Opens https://chalmoldb.streamlit.app every 4 hours so the Streamlit Community Cloud app
# does not go to sleep, wakes it if it did, and fails (GitHub e-mails the owner) when the
# app shows an error page or the expected content does not load.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: pip install playwright==1.47.0 > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - name: Open the app
        run: python scripts/keep_awake.py
