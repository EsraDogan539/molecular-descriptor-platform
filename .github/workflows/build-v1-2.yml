name: Build database v1.2 (temporary)
on:
  push:
    branches: [feature/db-v1.2-polymers]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt > /dev/null
      - run: python scripts/build_database_v1_2.py > data/build/build_v1_2_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data; git commit -m "Build database v1.2 [skip ci]" || true; git push
