name: Live check (temporary)
on:
  push:
    branches: [ci/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: main, path: mainsrc}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright rdkit pandas > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - run: mkdir -p docs/demo2; cp mainsrc/data/chalcogen_database_v1_master.csv.gz mainsrc/data/structures_3d_polymer.sdf.gz data/ 2>/dev/null || (mkdir -p data && cp mainsrc/data/chalcogen_database_v1_master.csv.gz mainsrc/data/structures_3d_polymer.sdf.gz data/); python scripts/demo2_mols.py > docs/demo2/mols_log.txt 2>&1 || true
      - run: python scripts/demo2_capture.py > docs/demo2/capture_stdout.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs; git commit -m "Demo2 capture [skip ci]" || true; git push
