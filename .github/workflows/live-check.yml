name: Live check (temporary)
on:
  push:
    branches: [ci/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: main, path: mainsrc}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q rdkit==2025.3.6 pandas numpy scikit-learn xgboost shap
      - run: mkdir -p docs/thesis; python scripts/thesis_s1_da.py --root mainsrc --out docs/thesis > docs/thesis/s1_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs; git commit -m "Phase 2 feasibility [skip ci]" || true; git push
