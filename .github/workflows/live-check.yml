name: Live check (temporary)
on:
  push:
    branches: [ci/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - run: mkdir -p docs/live_check; python scripts/live_probe.py > docs/live_check/probe_stdout.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs/live_check; git commit -m "Live check results [skip ci]" || true; git push
