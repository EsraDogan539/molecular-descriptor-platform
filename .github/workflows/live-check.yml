name: Live check (temporary)
on:
  push:
    branches: [ci/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          (npx -y @wp-playground/cli@latest server --blueprint=wp/blueprint.json --port=9400 --login > wp/server.log 2>&1 &)
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:9400/ && break; sleep 5; done
          sleep 10
      - run: python wp/check.py > wp/check.log 2>&1 || true; mkdir -p docs/wp; cp wp/*.log docs/wp/
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs; git commit -m "WP check [skip ci]" || true; git push
