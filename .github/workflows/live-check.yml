name: Live check (temporary)
on:
  push:
    branches: [ci/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/domain
          for d in chalmoldb.org chalmoldb.com chalmoldb.net; do
            code=$(curl -s -o docs/domain/$d.json -w "%{http_code}" "https://rdap.org/domain/$d" -L)
            echo "$d $code" >> docs/domain/result.txt
          done
          cat docs/domain/result.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs; git commit -m "Domain check [skip ci]" || true; git push
