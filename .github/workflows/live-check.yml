name: Live check (temporary)
on:
  push:
    branches: [ci/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y poppler-utils > /dev/null 2>&1 || true
          mkdir -p docs/keywords
          for f in keywords_bycateg.pdf keywords.pdf keywords_byalpha.pdf; do
            curl -sSL -A "Mozilla/5.0" -o docs/keywords/$f https://application.wiley-vch.de/vch/journals/$f || true
          done
          for f in docs/keywords/*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" 2>/dev/null || true; done
          ls -la docs/keywords > docs/keywords/listing.txt
          rm -f docs/keywords/*.pdf
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs/keywords; git commit -m "Keyword catalogue [skip ci]" || true; git push
