name: Scientific Core Tests

on:
  push:
    branches:
      - v0.8-scientific-core
      - v0.9-development
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run scientific core tests
        run: |
          python -m pytest -q tests

      - name: Syntax-check v0.8 application files
        run: |
          python -m py_compile descriptor_engine.py database_metadata.py database_browser.py similarity_search.py scientific_panel.py app_v08.py

      - name: Run v0.9 performance baseline
        run: |
          python benchmarks/performance_baseline.py --rows 200
