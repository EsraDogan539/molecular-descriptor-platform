name: Scientific Core Tests

on:
  push:
    branches:
      - v0.8-scientific-core
      - v0.9-development
      - v0.10-development
      - v0.11-development
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run scientific core tests
        run: |
          python -m pytest -q tests

      - name: Syntax-check application files
        run: |
          python -m py_compile release_metadata.py descriptor_engine.py descriptor_dictionary.py run_manifest.py database_metadata.py database_quality.py database_comparison.py database_filters.py public_labels.py provenance_export.py query_manifest.py structure_search.py database_browser.py similarity_search.py scientific_panel.py app_v08.py

      - name: Run performance baseline
        run: |
          python benchmarks/performance_baseline.py --rows 200

      - name: Audit curated database quality
        run: |
          python scripts/database_release_audit.py

      - name: Run v0.9 regression smoke checks
        run: |
          python scripts/v09_release_smoke.py

      - name: Run v0.10 release smoke checks
        run: |
          python scripts/v010_release_smoke.py
