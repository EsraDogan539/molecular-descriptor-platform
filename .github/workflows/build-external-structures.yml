name: Build external structures (temporary)
on:
  push:
    branches: [feat/db-v1.1]
    paths: ["scripts/build_external_structures.py", "data/sources/**", ".github/workflows/build-external-structures.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt > /dev/null
      - run: python scripts/build_external_structures.py > data/build_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/build data/build_log.txt; git commit -m "Build external structures [skip ci]" || true; git push
