name: Build database and screenshots (temporary)
on:
  push:
    branches: [feat/db-v1.1]
    paths: ["scripts/**", "data/sources/**", "data/releases/**", "tests/**", "*.py", "requirements.txt", ".github/workflows/build-external-structures.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          mkdir -p data/logs
          python scripts/build_external_structures.py > data/logs/build_structures.txt 2>&1 || true
          python scripts/build_database_v1_1.py > data/logs/build_db.txt 2>&1 || true
          python scripts/export_public_release.py > data/logs/export.txt 2>&1 || true
          python -m pytest -q tests > data/logs/tests.txt 2>&1 || true
          (streamlit run app_v08.py --server.headless true --server.port 8501 --client.toolbarMode viewer > data/logs/streamlit.txt 2>&1 &)
          sleep 25
          python scripts/capture_screenshots.py --url http://localhost:8501 --out docs/screenshots > data/logs/screens.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/screenshots; git commit -m "Build database and screenshots [skip ci]" || true; git push
